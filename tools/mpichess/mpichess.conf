# mpichess-queuing runtime configuration
#
# Read by the master (mpichess-queuing) from ./mpichess.conf, or from the file
# named by the environment variable MPICHESS_CONF. The file is re-read before
# every engine move, so you can retune it while a game is running.
#
# Lines are KEY=VALUE. Empty lines and '#' comments are ignored. A missing
# file, a missing key or an invalid value falls back to the default shown here.

# Maximum number of mpichess-client processes alive at the same time.
# A new client is only spawned when a previous one has delivered its result
# (sliding window queue). The clients are 100% CPU bound: start with roughly the
# number of cores across the cluster nodes that should take part and tune by
# the "Queue drained" wall time in mpichess.log.
#   0 = unlimited (all branches at once, the old mpichess behaviour)
#   default: 4
NUM_CLIENTS=4

# Minimum gap in milliseconds between two client spawns. A small value (e.g.
# 100-500) gives MattX time to migrate a fresh client away from its home node
# before the next one starts.
#   default: 0
SPAWN_DELAY_MS=0
